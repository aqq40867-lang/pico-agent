services:
  pico:
    build: .
    image: pico:latest
    # API key 从项目根目录的 .env 注入为环境变量（不会打进镜像）
    env_file: .env
    # 要处理的仓库：默认就是 pico 自己；设置 WORKSPACE 环境变量可换成别的目录
    volumes:
      - ${WORKSPACE:-.}:/workspace
    # 交互模式（REPL、审批确认）需要
    stdin_open: true
    tty: true
    # 用本地 Ollama 时，容器里通过 host.docker.internal 访问宿主机
    extra_hosts:
      - "host.docker.internal:host-gateway"
